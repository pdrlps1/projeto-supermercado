<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="h4 mb-4 text-center">Cadastro de Categoria</h2>

                <form class="row g-3" #form="ngForm">
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Nome da Categoria</label>
                        <input type="text" class="form-control" [(ngModel)]="categoria.nome" name="nome" required #nomeInput="ngModel" [class.is-invalid]="nomeInput.touched && nomeInput.invalid" placeholder="Ex: Alimentos, Higiene, Limpeza...">
                    </div>

                    @if (errorMessage) {
                    <div class="col-12 mt-2">
                        <div class="alert alert-danger py-2 mb-0" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            {{ errorMessage }}
                        </div>
                    </div>
                    }

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="button" class="btn btn-primary w-100 py-2" (click)="submit()">
                            {{ id ? 'Salvar Alterações' : 'Cadastrar Categoria' }}
                        </button>
                        <button type="button" class="btn btn-light border w-100 py-2"
                            (click)="return()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
